name: Publish to Comfy registry

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main commit SHA to publish after its push CI succeeds
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: registry-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    env:
      REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Check Registry token
        shell: bash
        run: |
          if [ -z "$REGISTRY_ACCESS_TOKEN" ]; then
            echo "::error::REGISTRY_ACCESS_TOKEN secret is missing. Registry publish was not attempted."
            exit 1
          fi

      - name: Verify exact main CI success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::target_sha must be a full 40-character commit SHA."
            exit 1
          fi

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Registry publish must be dispatched from main."
            exit 1
          fi
          if [ "${TARGET_SHA,,}" != "${GITHUB_SHA,,}" ]; then
            echo "::error::target_sha must match the exact main commit selected for this dispatch."
            exit 1
          fi

          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ "${TARGET_SHA,,}" != "${MAIN_SHA,,}" ]; then
            echo "::error::Refusing to publish a commit that is no longer the current main head."
            exit 1
          fi

          SUCCESSFUL_RUNS="$(
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch=main \
              -f event=push \
              -f status=success \
              -f head_sha="$TARGET_SHA" \
              -f per_page=1 \
              --jq '.total_count'
          )"
          if [ "$SUCCESSFUL_RUNS" -lt 1 ]; then
            echo "::error::No successful main push CI run exists for target_sha $TARGET_SHA."
            exit 1
          fi

      - name: Check out exact tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Check publish eligibility
        id: publish-check
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as file:
              print(tomllib.load(file)["project"]["version"])
          PY
          )"

          python - "$VERSION" <<'PY'
          import json
          import os
          import sys
          import urllib.request

          version = sys.argv[1]
          url = "https://api.comfy.org/nodes/deno-custom-nodes/versions?include_status_reason=true"

          with urllib.request.urlopen(url, timeout=30) as response:
              versions = json.load(response)

          exists = any(item.get("version") == version for item in versions)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"should_publish={'false' if exists else 'true'}\n")

          if exists:
              print(f"Version {version} already exists; skipping registry publish.")
          else:
              print(f"Version {version} is not registered yet; publishing.")
          PY

      - name: Publish Custom Node
        if: steps.publish-check.outputs.should_publish == 'true'
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          personal_access_token: ${{ env.REGISTRY_ACCESS_TOKEN }}
          skip_checkout: true
