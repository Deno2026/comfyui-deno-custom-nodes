  "comfyui",
  "comfyui-custom-nodes",
  "deno-custom-nodes",
  "minimax-h3",
  "minimax-h3-reference-to-video",
  "minimax-h3-audio-reference",
  "multi-reference-image",
  "audio-transcription",
  "audio-analysis",
  "whisper",
  "text-encoder-unload",
  "clip-unload",
  "dynamic-vram",
  "vram-management",
  "rtx-video-super-resolution",
  "nvidia-vfx",
  "nvvfx",
  "ltx-video",
  "ltx-2.3",
  "ltx-2.5",
  "ltx-tiled",
  "ltx-tiled-sampler",
  "ltx-av-tiled",
  "ltx-spatial-upscaler",
  "bernini",
  "bernini-prompt-guide",
  "bernini-conditioning",
  "comfyui-bernini",
  "wan-2.2",
  "wan2.2",
  "reference-video-edit",
  "ideogram",
  "ideogram4",
  "ideogram-4",
  "ideogram-director",
  "ideogram-translation",
  "multilingual-prompt",
  "bbox",
